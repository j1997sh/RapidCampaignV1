*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Proxima Nova","Avenir Next",Arial,sans-serif;color:#08254a;background:#fff}.pub-container{width:min(1180px,calc(100% - 40px));margin:auto}.rc-header{position:relative;z-index:5;background:#fff;border-bottom:1px solid rgba(8,37,74,.08)}.rc-header .pub-container{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:18px}.rc-brand{display:flex;align-items:center;gap:14px}.rc-brand img{max-width:170px;max-height:48px;object-fit:contain}.rc-brand strong{font-size:19px}.rc-header-area{font-size:13px;font-weight:800;color:#6e7e91}.rc-hero{position:relative;min-height:670px;background:var(--rc-primary,#08254a) center/cover no-repeat;color:#fff;overflow:hidden}.rc-hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,27,55,.94) 0%,rgba(4,27,55,.72) 52%,rgba(4,27,55,.26) 100%)}.rc-hero>.pub-container{position:relative;z-index:1;min-height:670px;display:flex;align-items:flex-end;padding-bottom:64px}.rc-hero-content{max-width:820px}.rc-kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.8);margin-bottom:18px}.rc-kicker:before{content:'';width:28px;height:3px;background:var(--rc-secondary,#1476d4)}.rc-hero h1{font-size:82px;line-height:.9;letter-spacing:-.055em;margin:0 0 20px;max-width:900px}.rc-hero p{font-size:21px;line-height:1.45;max-width:720px;margin:0 0 26px;color:rgba(255,255,255,.92)}.pub-btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:4px;background:var(--rc-secondary,#1476d4);color:#fff;padding:15px 20px;text-decoration:none;font-weight:900;font:inherit;cursor:pointer}.pub-section{padding:76px 0}.pub-section.alt{background:#f2f6fa}.pub-section h2{font-size:52px;line-height:.98;letter-spacing:-.04em;margin:0 0 16px}.pub-lead{font-size:20px;line-height:1.45;max-width:760px;color:#53677c}.p
