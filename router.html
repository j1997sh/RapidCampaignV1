<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find your local campaign</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Proxima Nova","Avenir Next",Arial,sans-serif;background:#f2f5f8;color:#102a47}.router-shell{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(380px,.9fr)}.router-brand{background:#08254a;color:#fff;padding:64px;display:flex;flex-direction:column;justify-content:space-between}.router-mark{display:flex;align-items:center;gap:12px;font-weight:800}.router-mark span{width:38px;height:38px;border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;border-radius:4px}.router-copy{max-width:650px}.router-copy h1{font-size:64px;line-height:.96;letter-spacing:-.045em;margin:0 0 22px}.router-copy p{font-size:20px;line-height:1.5;color:rgba(255,255,255,.82);max-width:570px}.router-foot{font-size:13px;color:rgba(255,255,255,.6)}.router-panel{display:grid;place-items:center;padding:44px}.router-card{width:min(100%,520px);background:#fff;border:1px solid #d7dfe8;padding:34px}.router-card h2{font-size:32px;margin:0 0 8px;letter-spacing:-.025em}.router-card p{color:#647386;line-height:1.5;margin:0 0 24px}.router-form{display:grid;gap:12px}.router-form label{font-size:14px;font-weight:700}.router-form input{width:100%;border:1px solid #bfc9d5;border-radius:3px;padding:14px 15px;font:inherit;font-size:18px;text-transform:uppercase}.router-form button{border:0;border-radius:3px;background:#1476d4;color:#fff;padding:14px 16px;font:inherit;font-weight:800;cursor:pointer}.router-form button:disabled{opacity:.55;cursor:wait}.router-state{margin-top:16px;font-size:14px;line-height:1.45;color:#657589}.router-state.error{color:#a92b2b}.router-state.success{color:#216a43}.router-area{margin-top:18px;border-top:1px solid #e1e6eb;padding-top:18px}.router-area strong{display:block;font-size:18px;margin-bottom:4px}@media(max-width:820px){.router-shell{grid-template-columns:1fr}.router-brand{padding:34px;min-height:330px}.router-copy h1{font-size:46px}.router-panel{padding:22px}.router-card{padding:24px}.router-foot{display:none}}
</style></head><body><main class="router-shell"><section class="router-brand"><div class="router-mark"><span>RC</span> Rapid Campaign</div><div class="router-copy"><h1 id="routerTitle">Find your local campaign</h1><p>Enter your postcode and we’ll take you straight to the campaign page for your area.</p></div><div class="router-foot">Local campaign pages powered by Rapid Campaign.</div></section><section class="router-panel"><div class="router-card"><h2>Your postcode</h2><p>We use your postcode only to find the correct local campaign page.</p><form id="routerForm" class="router-form"><label for="routerPostcode">Postcode</label><input id="routerPostcode" autocomplete="postal-code" inputmode="text" placeholder="SW1A 1AA" required><button id="routerSubmit" type="submit">Find my local campaign</button></form><div id="routerState" class="router-state"></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script src="assets/js/supabase-config.js?v=20260901-auth3"></script>
<script>
(()=>{const qs=new URLSearchParams(location.search),campaign=qs.get('campaign'),form=document.getElementById('routerForm'),input=document.getElementById('routerPostcode'),state=document.getElementById('routerState'),btn=document.getElementById('routerSubmit');function appRoot(){return `${location.origin}${location.pathname.replace(/\/[^/]*$/,'')}`.replace(/\/+$/,'')}function localUrl(slug){return `${appRoot()}/public-site.html?site=${encodeURIComponent(slug)}`}function carry(url){const target=new URL(url,location.href);for(const [k,v] of qs.entries())if(k!=='campaign')target.searchParams.set(k,v);target.searchParams.set('routed','postcode');return target.toString()}async function getSb(){if(window.CP_SUPABASE?.client)return window.CP_SUPABASE.client;if(window.CP_ADMIN?.sb)return window.CP_ADMIN.sb;await new Promise(r=>setTimeout(r,100));return window.CP_SUPABASE?.client||window.CP_ADMIN?.sb}form.onsubmit=async e=>{e.preventDefault();if(!campaign){state.className='router-state error';state.textContent='This campaign link is incomplete.';return}btn.disabled=true;btn.textContent='Finding your area…';state.className='router-state';state.textContent='';try{const sb=await getSb();if(!sb)throw new Error('Campaign service did not load');const r=await sb.functions.invoke('campaign-postcode-router',{body:{rollout_id:campaign,postcode:input.value}});if(r.error)throw r.error;const d=r.data||{};if(d.error)throw new Error(d.error);if(!d.ok||!d.site){state.className='router-state error';state.innerHTML=`We found <strong>${d.geography?.parliamentary_constituency||d.geography?.ward||'your area'}</strong>, but this campaign does not currently have a live page there.`;return}state.className='router-state success';state.innerHTML=`<div class="router-area"><strong>${d.site.area}</strong>Taking you to your local campaign…</div>`;setTimeout(()=>location.href=carry(localUrl(d.site.slug)),350)}catch(err){state.className='router-state error';state.textContent=err?.message||String(err)}finally{btn.disabled=false;btn.textContent='Find my local campaign'}}})();
</script></body></html>
